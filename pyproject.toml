[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tuik-sdmx-mcp"
dynamic = ["version"]
description = "MCP server for TÜİK SDMX REST API (Turkish Statistical Institute)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.14.0",
    "httpx>=0.27.0",
]

[project.scripts]
tuik-sdmx-mcp = "tuik_sdmx_mcp.cli:main"

[tool.hatch.version]
path = "src/tuik_sdmx_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tuik_sdmx_mcp"]
